<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Squishy Squad">
<meta name="theme-color" content="#D8E8E6">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light">
<title>Squishy Squad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23D8E8E6'/%3E%3Cpath d='M32 10c12 0 20 8 20 19 0 12-9 21-20 21s-20-9-20-21C12 18 20 10 32 10z' fill='%235FC4BB'/%3E%3Ccircle cx='25' cy='31' r='3.2' fill='%231F3E3C'/%3E%3Ccircle cx='39' cy='31' r='3.2' fill='%231F3E3C'/%3E%3Cpath d='M27 39q5 5 10 0' stroke='%231F3E3C' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

<style>
/* ==========================================================================
   SQUISHY SQUAD ‚Äî design tokens
   Palette: matte pastel, foam-not-flat. One high-saturation accent (--zap)
   that is ONLY allowed to appear at reward moments: box opening, reveal,
   mastery, table completion. If --zap is on screen, something good happened.
   ========================================================================== */
:root{
  /* Teal, in lighter and darker steps, is the whole world here.
     The one non-teal colour is --zap, and it is only allowed to show up
     when something good has happened. */
  --bg:#D8E8E6;          /* matte pale teal backdrop        */
  --surface:#FBFEFD;     /* puff white, card faces          */
  --ink:#1F3E3C;         /* deep teal-charcoal, all text    */
  --teal:#5FC4BB;        /* primary action                  */
  --teal-soft:#A2E2DA;   /* positive / secondary            */
  --teal-pale:#AECFCB;   /* silhouettes, tracks, disabled   */
  --teal-deep:#2E7C77;   /* darker teal, accents on light   */
  --zap:#FF6F91;         /* REWARD ONLY. hot coral          */

  --ink-soft:rgba(31,62,60,.60);
  --ink-faint:rgba(31,62,60,.34);

  /* type: chunky rounded display from system stacks, plain body */
  --f-display:ui-rounded,"SF Pro Rounded","Avenir Next Rounded","Varela Round","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px;
  --t-xl:26px; --t-2xl:34px; --t-3xl:46px; --t-q:62px;

  --r-xl:34px; --r-lg:26px; --r-md:18px; --r-sm:12px;

  /* foam, not material: bright inner top edge + dark inner bottom edge +
     a solid "thickness" drop, then a soft diffuse shadow underneath */
  --puff: inset 0 3px 0 rgba(255,255,255,.95),
          inset 0 -7px 0 rgba(31,62,60,.09),
          0 7px 0 rgba(31,62,60,.09),
          0 14px 24px rgba(31,62,60,.16);
  --puff-in: inset 0 4px 10px rgba(31,62,60,.14),
             inset 0 -3px 0 rgba(255,255,255,.7);
  --dur:.16s;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-body);color:var(--ink);background:var(--bg);
  font-size:var(--t-md);line-height:1.45;
  overflow-x:hidden;overscroll-behavior-y:none;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  min-height:100svh;
}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-display)}
h1,h2,h3,p{margin:0}
[hidden]{display:none !important}

.app{
  max-width:460px;margin:0 auto;width:100%;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px);
  padding-left:calc(env(safe-area-inset-left) + 16px);
  padding-right:calc(env(safe-area-inset-right) + 16px);
}
.view{animation:viewIn .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

/* ---------- typography ---------- */
.display{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.t-xs{font-size:var(--t-xs)} .t-sm{font-size:var(--t-sm)} .t-lg{font-size:var(--t-lg)}
.t-xl{font-size:var(--t-xl)} .t-2xl{font-size:var(--t-2xl)} .t-3xl{font-size:var(--t-3xl)}
.soft{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.up{text-transform:uppercase;letter-spacing:.11em;font-weight:700;font-size:var(--t-xs)}
.center{text-align:center}

/* ---------- the puff surface ---------- */
.puff{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--puff)}
.pressable{transition:transform var(--dur) cubic-bezier(.2,.8,.3,1), box-shadow var(--dur) ease}
.pressable:active{
  transform:translateY(6px) scale(.985);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),
             inset 0 -3px 0 rgba(31,62,60,.10),
             0 1px 0 rgba(31,62,60,.10),
             0 4px 8px rgba(31,62,60,.14);
}
.pressable[disabled]{opacity:.45;pointer-events:none}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:60px;padding:0 22px;border-radius:var(--r-lg);
  background:var(--surface);box-shadow:var(--puff);
  font-family:var(--f-display);font-weight:800;font-size:var(--t-lg);
  width:100%;
}
.btn-hero{min-height:96px;font-size:var(--t-2xl);background:var(--teal);border-radius:var(--r-xl)}
.btn-go{background:var(--teal-soft)}
.btn-zap{background:var(--zap)}
.btn-ghost{background:transparent;box-shadow:none;min-height:48px;font-size:var(--t-md);color:var(--ink-soft);font-weight:700}
.btn-sm{min-height:48px;font-size:var(--t-md);border-radius:var(--r-md)}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}

/* ---------- home ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:var(--t-xl);letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:12px}
.brand.holding{background:rgba(31,62,60,.06)}
.brand.t-lg{font-size:var(--t-lg)}   /* secondary headers, not the home title */
.brand svg{width:30px;height:30px;flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
  background:var(--surface);box-shadow:var(--puff);font-family:var(--f-display);font-weight:800;font-size:var(--t-md);white-space:nowrap}
.chip svg{width:22px;height:22px;flex:none}
.chip-flat{box-shadow:none;background:rgba(255,255,255,.55)}

.card{padding:20px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--puff)}
.meter{height:20px;border-radius:999px;background:var(--teal-pale);box-shadow:var(--puff-in);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--teal-soft);
  transition:width .7s cubic-bezier(.2,.9,.3,1)}
.meter.gold i{background:var(--zap)}

/* the quest card ‚Äî the only place a real-world prize is named */
.quest{border:2px solid var(--teal);position:relative;overflow:hidden}
.quest.done{background:var(--zap)}
.quest-meter{margin-top:12px}
.quest-meter i{background:var(--teal)}
.prize{margin-top:10px;padding:10px 13px;border-radius:var(--r-sm);background:var(--bg);
  box-shadow:var(--puff-in);font-size:var(--t-sm)}
.prize b{font-family:var(--f-display)}
.certificate{border:3px solid var(--zap);background:var(--surface);text-align:center;
  padding:22px 18px;border-radius:var(--r-xl);box-shadow:var(--puff)}

.tablestrip{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tbadge{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:var(--t-sm);
  background:var(--teal-pale);color:rgba(31,62,60,.42);box-shadow:var(--puff-in)}
.tbadge.open{background:var(--surface);color:var(--ink);box-shadow:var(--puff)}
.tbadge.done{background:var(--teal-soft);color:var(--ink)}

/* ---------- practice ---------- */
.dots{display:flex;gap:5px;justify-content:center;margin:4px 0 18px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--teal-pale);box-shadow:var(--puff-in);
  transition:transform .3s cubic-bezier(.2,1.6,.4,1), background .3s}
.dot.done{background:var(--teal-soft)}
.dot.now{background:var(--teal);transform:scale(1.45)}

.qcard{
  position:relative;padding:30px 20px;border-radius:var(--r-xl);
  background:var(--surface);box-shadow:var(--puff);text-align:center;min-height:190px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.qcard.flash-good{animation:flashGood .5s ease}
@keyframes flashGood{
  0%{transform:scale(1)}
  30%{transform:scale(1.035);background:#E2FBF7}
  100%{transform:scale(1);background:var(--surface)}
}
.qtext{font-family:var(--f-display);font-weight:800;font-size:var(--t-q);letter-spacing:-.03em;line-height:1}
.qtext small{font-size:.5em;opacity:.4;font-weight:800}
.answerbox{
  min-width:150px;min-height:66px;padding:6px 20px;border-radius:var(--r-md);
  background:var(--bg);box-shadow:var(--puff-in);
  font-family:var(--f-display);font-weight:800;font-size:var(--t-2xl);
  display:flex;align-items:center;justify-content:center;letter-spacing:.02em;
}
.answerbox.empty::after{content:"";width:3px;height:34px;background:var(--ink-faint);border-radius:2px;animation:caret 1.1s steps(1,end) infinite}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.key{
  height:66px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--puff);
  font-family:var(--f-display);font-weight:800;font-size:var(--t-xl);
  display:grid;place-items:center;
}
.key.wide{grid-column:span 1}
.key-go{background:var(--teal-soft)}
.key-clr{background:var(--teal-pale);font-size:var(--t-md)}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choice{height:80px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--puff);
  font-family:var(--f-display);font-weight:800;font-size:var(--t-2xl);display:grid;place-items:center}
.choice.picked-good{background:var(--zap)}
.choice.picked-off{background:var(--teal-pale)}

.saybox{
  margin-top:14px;padding:16px 18px;border-radius:var(--r-lg);
  background:var(--surface);box-shadow:var(--puff);
}
.saybox .lede{font-family:var(--f-display);font-weight:800;font-size:var(--t-lg);margin-bottom:6px}
.trick{
  margin-top:10px;padding:14px 16px;border-radius:var(--r-md);
  background:var(--bg);box-shadow:var(--puff-in);font-size:var(--t-sm);line-height:1.5;
}
.trick b{font-family:var(--f-display)}

.arraydots{display:grid;gap:6px;justify-content:center;margin:6px auto}
.arraydots i{width:13px;height:13px;border-radius:50%;background:var(--teal);
  box-shadow:inset 0 -3px 0 rgba(31,62,60,.10);display:block;
  animation:popdot .32s cubic-bezier(.2,1.7,.4,1) both}
@keyframes popdot{from{transform:scale(0)}to{transform:scale(1)}}

.numline{width:100%;overflow:hidden;padding:8px 0}
.numline svg{width:100%;height:64px;display:block}

.speedbar{height:8px;border-radius:999px;background:var(--teal-pale);overflow:hidden;margin-bottom:12px}
.speedbar i{display:block;height:100%;background:var(--teal);width:100%;transform-origin:left}

/* ---------- squishy art ---------- */
.sq{display:block;width:100%;height:100%}
.sqframe{aspect-ratio:1;display:grid;place-items:center;padding:8px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{
  position:relative;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--puff);
  padding:8px 8px 6px;text-align:center;
}
.slot.locked{background:rgba(255,255,255,.4);box-shadow:var(--puff-in)}
.slot .nm{font-family:var(--f-display);font-weight:800;font-size:11px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ct{position:absolute;top:6px;right:8px;font-family:var(--f-display);font-weight:800;
  font-size:11px;color:var(--ink-faint)}
.slot .pin{position:absolute;top:5px;left:6px;width:16px;height:16px}
.silhouette{filter:brightness(0) saturate(0) opacity(.16)}
.tierbar{height:5px;border-radius:999px;margin-top:5px}
/* rarity ramp: pale -> teal -> deep teal -> the reward accent */
.tier-common{background:#C6D6D4} .tier-rare{background:var(--teal-soft)}
.tier-epic{background:var(--teal-deep)} .tier-legendary{background:var(--zap)}

.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.5);
  font-family:var(--f-display);font-weight:800;font-size:var(--t-sm);white-space:nowrap}
.tab.on{background:var(--surface);box-shadow:var(--puff)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(31,62,60,.42);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:60;
  animation:fadeIn .2s ease;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:var(--r-xl);
  padding:22px 20px calc(20px);box-shadow:0 -10px 40px rgba(31,62,60,.3);
  animation:sheetUp .32s cubic-bezier(.2,.9,.3,1.05);max-height:88svh;overflow:auto}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- BLIND BOX: the signature interaction ---------- */
.boxstage{
  position:relative;height:340px;display:grid;place-items:center;margin:6px 0 4px;
  touch-action:none;
}
#boxHold{
  width:230px;height:230px;display:grid;place-items:center;position:relative;
  will-change:transform;touch-action:none;
}
#boxHold svg{width:100%;height:100%;overflow:visible}
.pressring{position:absolute;inset:-16px;pointer-events:none}
.pressring circle{fill:none;stroke-width:9;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%}
.puffs{position:absolute;inset:0;pointer-events:none;overflow:visible}
.puffs span{position:absolute;left:50%;top:50%;border-radius:50%;
  background:var(--zap);opacity:.9;will-change:transform,opacity}
.revealwrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.revealcard{width:250px;padding:16px;border-radius:var(--r-xl);background:var(--surface);
  box-shadow:var(--puff);text-align:center;will-change:transform}
.rarityflag{display:inline-block;padding:5px 13px;border-radius:999px;
  font-family:var(--f-display);font-weight:800;font-size:var(--t-xs);
  text-transform:uppercase;letter-spacing:.09em}

.glow{position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,111,145,.75),rgba(255,111,145,0) 68%);
  opacity:0;pointer-events:none;transition:opacity .4s}
.glow.on{opacity:1}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 18px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--puff)}
.setrow .lb{font-family:var(--f-display);font-weight:800}
.toggle{width:66px;height:38px;border-radius:999px;background:var(--teal-pale);position:relative;
  box-shadow:var(--puff-in);flex:none;transition:background .2s}
.toggle i{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;
  background:var(--surface);box-shadow:0 3px 6px rgba(31,62,60,.3);
  transition:transform .24s cubic-bezier(.2,1.5,.4,1)}
.toggle.on{background:var(--teal-soft)}
.toggle.on i{transform:translateX(28px)}
.toggle[aria-disabled="true"]{opacity:.4}
textarea{width:100%;min-height:120px;border-radius:var(--r-md);border:0;padding:12px;
  background:var(--bg);box-shadow:var(--puff-in);font-family:var(--f-mono);font-size:11px;
  -webkit-user-select:text;user-select:text;resize:vertical}

/* ---------- grown-up view: deliberately unthemed ---------- */
.grown{font-family:var(--f-body);background:#fff;color:#1c1c1e;border-radius:10px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.18)}
.grown h2{font-size:15px;font-weight:600;margin:18px 0 8px;letter-spacing:0}
.grown h2:first-child{margin-top:0}
.grown table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.grown td,.grown th{border:1px solid #e3e3e6;padding:4px 3px;text-align:center}
.grown th{background:#f5f5f7;font-weight:600}
.gcell{font-size:10px;line-height:1.25;font-variant-numeric:tabular-nums}
.b0{background:#fff;color:#b0b0b5} .b1{background:#ffdad6} .b2{background:#ffe9c9}
.b3{background:#fdf4c3} .b4{background:#dcf0cd} .b5{background:#bfe3c8}
/* speed mode: green = retrieved, amber = worked out, red = counted */
.f-fluent{background:#cdeacd} .f-working{background:#fdf0c0}
.f-counting{background:#ffd9d4} .f-untested{background:#fff;color:#b0b0b5}
.gtabs{display:flex;gap:6px;margin-bottom:8px}
.gtab{font-family:var(--f-body);font-size:12px;padding:5px 12px;border:1px solid #d8d8dc;
  border-radius:6px;background:#f6f6f8;color:#3a3a3f}
.gtab.on{background:#3a3a3f;color:#fff;border-color:#3a3a3f}
.gstat{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
.gstat b{font-size:19px;display:block;font-weight:650;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:6px}
.spark i{flex:1;background:#7d8fb3;border-radius:2px 2px 0 0;min-height:2px}
.glist{font-size:12px;line-height:1.7;font-family:var(--f-mono)}
.gkey{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;margin-top:6px}
.gkey span{padding:2px 7px;border:1px solid #e3e3e6;border-radius:3px}
.gform{display:flex;flex-direction:column;gap:10px;margin-top:12px;font-size:13px}
.gform label{display:flex;flex-direction:column;gap:5px;color:#3a3a3f}
.gform label:first-child{flex-direction:row;align-items:center;gap:8px}
.gform input[type=text]{font-family:var(--f-body);font-size:14px;padding:9px 11px;
  border:1px solid #d8d8dc;border-radius:6px;background:#fff;color:#1c1c1e;
  -webkit-user-select:text;user-select:text}
.gform input[type=checkbox]{width:18px;height:18px;flex:none}
.gbtn{font-family:var(--f-body);font-size:13px;padding:9px 16px;border-radius:6px;
  background:#1c1c1e;color:#fff;align-self:flex-start;font-weight:500}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;
  border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:var(--t-sm);
  z-index:90;animation:toastIn .3s cubic-bezier(.2,1.4,.4,1);max-width:88vw;text-align:center}
@keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translateX(-50%);opacity:1}}

.wobble{animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-1.4deg) translateY(0)}50%{transform:rotate(1.4deg) translateY(-5px)}}
.breathe{animation:brt 3.4s ease-in-out infinite}
@keyframes brt{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{
  animation-duration:.001ms !important;animation-iteration-count:1 !important;
  transition-duration:.001ms !important;
}
@media (max-height:700px){
  :root{--t-q:52px;--t-2xl:30px}
  .key{height:58px}
  .boxstage{height:290px}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ HOME ============ -->
  <section class="view" id="v-home">

<script>
"use strict";
/* ==========================================================================
   SQUISHY SQUAD
   One file, no deps, offline. Sections:
     1. config + name          2. storage        3. squishy roster + art
     4. fact model / Leitner   5. strategies     6. session builder
     7. views                  8. blind box interaction
   ========================================================================== */

/* --- 1. the name lives here and only here -------------------------------- */
const APP_NAME = "Squishy Squad";

/* ==========================================================================
   COIN ECONOMY  ‚Äî tuned against a 30-session simulation of both a confident
   and a struggling learner. Both land inside "one box per session or two":
     confident learner  ~28 coins/session -> a box every 1.3 sessions
     struggling learner ~24 coins/session -> a box every 1.5 sessions
   Coins are paid for FINISHING, never per correct answer. Adjust freely:
   raising BOX_COST is the cleanest way to slow the collection down.
   ========================================================================== */
const ECON = {
  SESSION:      10,   // finishing 12 questions, however they went
  SWEEP:         4,   // every answer right first try (bonus, never a penalty)
  MASTER:        5,   // per fact that crossed into "learned" this session
  DAY:           3,   // first session of a new day
  STREAK_STEP:   1,   // x min(streak, 7)
  TABLE:        40,   // a whole table finished
  BOX_COST:     35,   // one blind box
  DUP: {common:7, rare:14, epic:30, legendary:60},   // duplicate -> coins
  ODDS:{common:.58, rare:.30, epic:.09, legendary:.03},
  PITY_RARE:    10,   // boxes since a rare+ -> force one
  PITY_EPIC:    25    // boxes since an epic+ -> force one
};

/* --- learning constants (mirror of the validated simulation) -------------- */
const UNLOCK_ORDER = [2,10,5,11,3,4,6,9,8,7,12];
const INTERVAL     = {1:0, 2:1, 3:2, 4:5, 5:9};   // in sessions
const SESSION_LEN  = 12;
const MAX_NEW      = 2;
const MASTER_BOX   = 4, MASTER_HITS = 3, MASTER_DAYS = 3;

/* ==========================================================================
   FLUENCY (silent)
   A right answer at 12 seconds and a right answer at 3 seconds are not the
   same thing: the first is counting, the second is remembering. We time every
   typed answer and hold a fact back until it comes out fast.

   Six decisions worth knowing about, because they're what make the number
   trustworthy rather than noise:

   1. We time TO THE FIRST KEYPRESS, not to "enter". Typing 84 takes longer
      than typing 8, and that difference is thumbs, not knowledge. First
      keypress is the moment she retrieved the answer.
   2. Typed answers only. Multiple choice is untimed ‚Äî reading four options
      is reading speed, not recall.
   3. The MEDIAN OF THE LAST 3 decides, never a single answer. One 12-second
      response is someone talking to her, not a gap in her 4s.
   4. Timing is VOIDED if she opened a hint, or if the app went to the
      background mid-question, or if the answer took over a minute. A voided
      question still counts for correctness ‚Äî it just doesn't get a stopwatch.
   5. Slow-but-correct still PROMOTES the fact (a right answer is never walked
      back) but caps its SCHEDULING box at 3, so it keeps coming back every
      couple of sessions until it's quick.
   6. Scheduling and credit are deliberately SEPARATE. f.box (fluency-capped)
      decides when she sees a fact again; f.peak (uncapped) decides whether it
      counts as learned. Gating the visible counter on speed was the first
      thing I tried and a simulated slower learner sat at "0 of 66 learned"
      for fifteen straight sessions ‚Äî a fortnight of work showing nothing.
      She now gets credit for being right on the old timeline, and the app
      quietly keeps drilling whatever is still slow.
   7. She is never shown any of this. No timer, no "too slow", nothing.
      Speed mode stays a separate, opt-in, purely-for-fun thing.
   ========================================================================== */
const FLUENCY = {
  FAST_MS:    4000,   // at or under this (to first keypress) = remembered
  SLOW_MS:   10000,   // at or over this = almost certainly counting
  MAX_MS:    60000,   // longer than this is a distraction, not an answer
  KEEP:          5,   // recall times retained per fact
  WINDOW:        3,   // how many of them the median looks at
  CAP_BOX:       3,   // ceiling for a fact that isn't fluent yet
  /* Escape hatch. If she's answered a fact correctly this many times and it's
     still not quick, stop holding it down ‚Äî endless drilling of one fact is
     its own kind of punishment. The parent report still shows it as slow. */
  PATIENCE:     12
};

/* ==========================================================================
   3. SQUISHY ROSTER + ART

   mouths, blush) plus hand-drawn extras, so they read as one family without

  dot:(x,y,r)=>{r=r||4.4;return `<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${x+r*.34}" cy="${y-r*.4}" r="${r*.3}" fill="#fff"/>`;},
  arc:(x,y,r)=>{r=r||5.2;return `<path d="M${x-r} ${y+2}q${r} -${r*1.5} ${r*2} 0" stroke="${INK}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;},
  sleepy:(x,y,r)=>{r=r||5;return `<path d="M${x-r} ${y}q${r} ${r*.9} ${r*2} 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;},
  wide:(x,y,r)=>{r=r||6;return `<ellipse cx="${x}" cy="${y}" rx="${r*.82}" ry="${r}" fill="${INK}"/><circle cx="${x+r*.3}" cy="${y-r*.42}" r="${r*.32}" fill="#fff"/><circle cx="${x-r*.34}" cy="${y+r*.3}" r="${r*.16}" fill="#fff" opacity=".8"/>`;},
  star:(x,y)=>`<path d="M${x} ${y-6}l1.7 4.2 4.5.3-3.5 2.9 1.2 4.4L${x} ${y+3.4}l-3.9 2.4 1.2-4.4-3.5-2.9 4.5-.3z" fill="${INK}"/>`,
  wink:(x,y,r)=>`<path d="M${x-(r||5)} ${y}q${(r||5)} ${(r||5)*.9} ${(r||5)*2} 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`

  smirk:(x,y,w)=>{w=w||10;return `<path d="M${x-w/2} ${y}q${w*.6} ${w*.55} ${w} -${w*.15}" stroke="${INK}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;}
};
const BLUSH = (y,gap,c)=>{gap=gap||24;c=c||"#EF93A8";return `<ellipse cx="${50-gap}" cy="${y}" rx="6" ry="4" fill="${c}" opacity=".45"/><ellipse cx="${50+gap}" cy="${y}" rx="6" ry="4" fill="${c}" opacity=".45"/>`;};

const BY_ID = {};
SQUISHIES.forEach(s => BY_ID[s.id] = s);
// 25 obtainable from boxes; trophies and milestone squishies must be earned
const BOX_POOL = SQUISHIES.filter(s => !s.table && !s.milestone);
const TROPHY_FOR = {};
SQUISHIES.filter(s => s.table).forEach(s => TROPHY_FOR[s.table] = s.id);
const TIER_LABEL = {common:"Common", rare:"Rare", epic:"Epic", legendary:"Legendary"};
const TIER_COLOR = {common:"#C6D6D4", rare:"var(--teal-soft)", epic:"var(--teal)", legendary:"var(--zap)"};

/* ==========================================================================
   2 + 4. STORAGE AND THE FACT MODEL
   One namespaced localStorage key. Every read and write is wrapped; if
   storage is unavailable the app still runs, it just forgets.
   ========================================================================== */
const LS_KEY = "squishysquad.v1";
let storageOK = true;

const today = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
};
const daysBetween = (a,b) => {
  if(!a || !b) return 99;
  const A = new Date(a+"T00:00:00"), B = new Date(b+"T00:00:00");
  return Math.round((B-A)/86400000);
};

function blankState(){
  return {
    v:1, created:today(), lastDay:null, streak:0, bestStreak:0,
    coins:0, sess:0,
    facts:{},            // "3x7" -> {box, due, hits, days:[], stage, miss}
    ever:[],             // monotonic: facts that have EVER been learned
    unlocked:[], tablesDone:[],
    concepts:{ones:0, zeros:0, resurface:null},   // 0 = not taught yet, 1 = retired
    coll:{},             // squishy id -> {n, first, fav}
    goals:{on:false, prize:"", t10:null, t5:null},   // the real-world prize
    boxes:0, sinceRare:0, sinceEpic:0,
    set:{sound:false, haptics:true, motion:true, speed:false},
    placed:false,
    stats:{q:0, c:0, days:{}, hist:[]}
  };
}

let S = blankState();

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(!p || typeof p !== "object") return;
    S = Object.assign(blankState(), p);
    S.set   = Object.assign(blankState().set, p.set || {});
    S.stats = Object.assign(blankState().stats, p.stats || {});
    S.concepts = Object.assign(blankState().concepts, p.concepts || {});
    S.goals = Object.assign(blankState().goals, p.goals || {});
    if(!Array.isArray(S.ever)) S.ever = [];
    if(!Array.isArray(S.unlocked)) S.unlocked = [];
  }catch(e){ storageOK = false; }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; }
}

/* --- the 66 fact families ------------------------------------------------ */
const fkey = (a,b) => Math.min(a,b) + "x" + Math.max(a,b);
const fparts = k => k.split("x").map(Number);
const ALL_FACTS = (()=>{ const o=[]; for(let a=2;a<=12;a++) for(let b=a;b<=12;b++) o.push(fkey(a,b)); return o; })();
const tableFacts = t => ALL_FACTS.filter(k => fparts(k).indexOf(t) >= 0);

const isLearned = k => S.ever.indexOf(k) >= 0;
const learnedCount = () => S.ever.length;

/* --- fluency: how fast the answer arrives, not just whether it does ------- */
const median = a => {
  if(!a || !a.length) return null;
  const s = a.slice().sort((x,y) => x-y);
  const m = Math.floor(s.length/2);
  return s.length % 2 ? s[m] : Math.round((s[m-1]+s[m])/2);
};
/* median of the most recent WINDOW typed answers */
function recallMedian(k){
  const f = S.facts[k];
  if(!f || !f.rt || !f.rt.length) return null;
  return median(f.rt.slice(-FLUENCY.WINDOW));
}
function fluencyOf(k){
  const m = recallMedian(k);
  if(m === null) return "untested";
  if(m <= FLUENCY.FAST_MS) return "fluent";
  if(m >= FLUENCY.SLOW_MS) return "counting";
  return "working";
}
const isFluent = k => fluencyOf(k) === "fluent";

/* ==========================================================================
   THE SPEED CLUBS ‚Äî the one place a real-world prize hangs off the timings.
   Two rungs: every fact under 10 seconds, then every fact under 5. A grown-up
   turns this on and writes what the prize is; nothing is promised otherwise.

   A fact only counts once it has at least MIN_SAMPLES typed answers, so she
   can't clear a club on facts the app never actually tested her on. Progress
   is stated as facts-in, never facts-short, and once a club is earned it is
   earned permanently ‚Äî the date is stamped and it can't be lost to a bad day.
   ========================================================================== */
const CLUBS = [
  {id:"t10", ms:10000, name:"Ten Second Club",  squishy:"clubten",
   blurb:"Every single fact, none of them slow.", coins:120},
  {id:"t5",  ms:5000,  name:"Five Second Club", squishy:"clubfive",
   blurb:"Every single fact, straight off the top of your head.", coins:250}
];
const CLUB_MIN_SAMPLES = 2;

function clubQualifies(k, ms){
  const f = S.facts[k];
  if(!f || !f.rt || f.rt.length < CLUB_MIN_SAMPLES) return false;
  const m = recallMedian(k);
  return m !== null && m <= ms;
}
function clubStatus(club){
  const inC = ALL_FACTS.filter(k => clubQualifies(k, club.ms));
  return {
    club: club,
    earned: S.goals && S.goals[club.id] ? S.goals[club.id] : null,
    n: inC.length,
    total: ALL_FACTS.length,
    /* the ones not in yet, slowest first ‚Äî shown to a grown-up as a worklist,
       and to her only as a count */
    outstanding: ALL_FACTS.filter(k => !clubQualifies(k, club.ms))
      .sort((a,b) => (recallMedian(b) || 1e9) - (recallMedian(a) || 1e9))
  };
}
/* the club she's currently chasing: the first one not yet earned */
function activeClub(){
  return CLUBS.find(c => !(S.goals && S.goals[c.id])) || null;
}
/* Credit runs off f.peak, not f.box: being right is what earns the counter,
   and speed decides scheduling instead. See the FLUENCY note above. */
function meetsMastery(k){
  const f = S.facts[k];
  const rung = f ? (f.peak == null ? f.box : f.peak) : 0;
  return !!(f && rung >= MASTER_BOX && f.hits >= MASTER_HITS && f.days.length >= MASTER_DAYS);
}
const tableProgress = t => {
  const fs = tableFacts(t);
  return fs.filter(isLearned).length / fs.length;
};

/* one table at a time; the next opens when the current one is 80% learned.
   Gated on the monotonic "ever learned" set, so a table can never re-lock. */
function checkUnlocks(){
  const opened = [];
  for(let guard=0; guard<12; guard++){
    const next = UNLOCK_ORDER.find(t => S.unlocked.indexOf(t) < 0);
    if(next === undefined) break;
    const prior = UNLOCK_ORDER.filter(t => S.unlocked.indexOf(t) >= 0);
    const gate = prior.length ? prior[prior.length-1] : null;
    if(gate === null || tableProgress(gate) >= .8){ S.unlocked.push(next); opened.push(next); }
    else break;
  }
  return opened;
}
/* a fact is in play if EITHER factor belongs to an unlocked table:
   "the 2s" means 2x2 through 2x12, not just 2x2 */
function poolFacts(){
  const seen = {};
  S.unlocked.forEach(t => tableFacts(t).forEach(k => seen[k] = 1));
  return Object.keys(seen);
}

/* ==========================================================================
   5. STRATEGIES ‚Äî written per fact family. The hard core each get their own.
   ========================================================================== */
const TRICKS = {

const TABLE_TRICKS = {
  10:{t:"Add a zero", b:"Anything √ó 10 is just that number with a <b>0</b> stuck on the end. 10 √ó 7 = 70. That's the whole rule."},
  11:{t:"Say the digit twice", b:"For single digits, 11 √ó n is just that digit <b>twice</b>. 11 √ó 4 = 44. 11 √ó 8 = 88. Free points."},
  5: {t:"Half of the tens", b:"Do √ó 10 first, then take <b>half</b>. 5 √ó 8 ‚Üí 80 ‚Üí 40. Every answer ends in 5 or 0."},
  2: {t:"Just double it", b:"√ó 2 means <b>double</b>. You already do this with everything else in your life."},
  9: {t:"The finger trick", b:"Hold up ten fingers. For 9 √ó n, bend down the <b>n-th</b> finger. Fingers to the left = tens, fingers to the right = ones. Also: the digits of every 9s answer add up to <b>9</b>."},
  12:{t:"Ten plus two", b:"12 √ó n = (10 √ó n) + (2 √ó n). 12 √ó 7 ‚Üí 70 + 14 ‚Üí <b>84</b>. Split it, don't memorize it."},

  8: {t:"Double, double, double", b:"√ó 8 is <b>three</b> doubles. 8 √ó 6 ‚Üí 12 ‚Üí 24 ‚Üí 48. Same move, three times."},
  6: {t:"Half, then tack it on", b:"6 √ó an even number: take <b>half</b> of the even number, then stick that number on the end. 6 √ó 8 ‚Üí half of 8 is 4 ‚Üí <b>48</b>. 6 √ó 4 ‚Üí 2, then 4 ‚Üí <b>24</b>. It just works."},
  3: {t:"Double plus one more", b:"√ó 3 = double it, then add one more of it. 3 √ó 7 ‚Üí 14 + 7 ‚Üí <b>21</b>."}
};
const TRICK_PRIORITY = [10,11,5,2,9,12,4,8,6,3];

function trickFor(a,b){
  const k = fkey(a,b);
  if(TRICKS[k]) return TRICKS[k];
  if(a === b) return {t:"Squares club", b:`<b>${a*b}</b>. ${a} √ó ${a} is a square ‚Äî same number twice. Squares are worth learning as their own set; there are only eleven of them.`};
  if(a % 2 === 0 || b % 2 === 0){
    const six = (a===6?b:(b===6?a:0));
    if(six && six % 2 === 0) return TABLE_TRICKS[6];
  }
  for(const t of TRICK_PRIORITY){ if(a === t || b === t) return TABLE_TRICKS[t]; }
  return {t:"Break it apart", b:`Split it: ${a} √ó ${b} = ${a} √ó ${b-1} (${a*(b-1)}) plus one more ${a} ‚Üí <b>${a*b}</b>.`};
}

/* ==========================================================================
   6. SESSION BUILDER
   ~70% due review, ~30% new. Never more than 2 new facts. A new fact costs
   two scored slots (recognize + recall); its "meet" card is a tap-through
   and does not consume one.
   ========================================================================== */
function orient(k){
  const p = fparts(k);
  return Math.random() < .5 ? {a:p[0], b:p[1]} : {a:p[1], b:p[0]};
}

function pickConcept(){
  if(S.concepts.resurface) return S.concepts.resurface;      // she missed a rule check
  if(S.sess < 4 && !S.concepts.ones)  return "ones";
  if(S.sess < 5 && !S.concepts.zeros) return "zeros";
  return null;
}

function buildSession(){
  const pool = poolFacts();
  const introduced = pool.filter(k => S.facts[k]);
  const due = introduced.filter(k => S.facts[k].due <= S.sess)
    .sort((x,y) => (S.facts[x].box - S.facts[y].box) || (S.facts[x].due - S.facts[y].due));
  const rank = k => { const p = fparts(k); return Math.min(UNLOCK_ORDER.indexOf(p[0]), UNLOCK_ORDER.indexOf(p[1])); };
  const fresh = pool.filter(k => !S.facts[k])
    .sort((x,y) => (rank(x) - rank(y)) || (fparts(x)[0]*fparts(x)[1] - fparts(y)[0]*fparts(y)[1]));
  const newTake = fresh.slice(0, MAX_NEW);

  const concept = pickConcept();
  const len = SESSION_LEN - (concept ? 2 : 0);          // keep concept sessions short
  const reviewSlots = Math.max(0, len - 2 * newTake.length);

  const take = due.slice(0, reviewSlots);
  let reviews = take.map(k => ({k:"q", f:k, stage:S.facts[k].stage}));

  // keep-it-warm: nothing due -> resurface the stalest facts
  if(reviews.length < reviewSlots && introduced.length){
    const warm = introduced.filter(k => take.indexOf(k) < 0).sort((x,y) => S.facts[x].due - S.facts[y].due);
    let i = 0;
    while(reviews.length < reviewSlots && warm.length && i < 200){
      const k = warm[i % warm.length];
      reviews.push({k:"q", f:k, stage:S.facts[k].stage});
      i++;
    }
  }
  shuffle(reviews);
  // open on something she already owns, so question 1 is a win
  for(let i=0;i<reviews.length;i++){
    const f = S.facts[reviews[i].f];
    if(f && f.box >= 3){ reviews.unshift(reviews.splice(i,1)[0]); break; }
  }

  const seq = reviews.slice();
  newTake.forEach((k,i) => {
    const at = Math.min(1 + i*5, seq.length);
    seq.splice(at, 0, {k:"meet", f:k}, {k:"q", f:k, stage:1});
    seq.splice(Math.min(at+5, seq.length), 0, {k:"q", f:k, stage:2});
  });

  // very first sessions can run dry ‚Äî top up with spaced extra reps
  let scored = seq.filter(x => x.k === "q").length;
  if(scored < len){
    const p2 = newTake.concat(introduced);
    let j = 0;
    while(scored < len && p2.length && j < 200){
      seq.push({k:"q", f:p2[j % p2.length], stage:2});
      scored++; j++;
    }
  }

  if(concept) seq.unshift({k:"concept", which:concept});
  // once the rules are retired, spot-check them occasionally
  else if(S.concepts.ones && S.concepts.zeros && Math.random() < .12){
    const kind = Math.random() < .5 ? "one" : "zero";
    const n = 2 + Math.floor(Math.random()*11);
    seq.splice(Math.min(4, seq.length), 0, {k:"rule", kind:kind, n:n});
  }

  seq.forEach(it => { if(it.k === "q" || it.k === "meet") Object.assign(it, orient(it.f)); });
  return {seq:seq, len:len, nNew:newTake.length, nDue:due.length};
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

/* plausible distractors: off-by-one-multiple, digit-reversed, adjacent facts.
   Never random numbers ‚Äî a wrong option should be tempting, not silly. */
function distractors(a,b){
  const ans = a*b, out = [];
  const push = v => {
    if(!Number.isFinite(v) || v === ans || v <= 0) return;
    if(v < Math.max(2, ans*.35) || v > ans*1.9 + 8) return;
    if(out.indexOf(v) < 0) out.push(v);
  };
  if(ans >= 10 && ans < 100){
    const rev = Number(String(ans).split("").reverse().join(""));
    push(rev);
  }
  push(ans + a); push(ans - a); push(ans + b); push(ans - b);
  push((a+1)*(b-1)); push((a-1)*(b+1)); push(a + b); push(ans + 1); push(ans - 1);
  shuffle(out);
  return out.slice(0,3);
}

/* ==========================================================================
   GRADING ‚Äî a miss never subtracts anything. It moves the fact to box 1 and
   puts it back in the rotation. That is the entire consequence.
   ========================================================================== */
function ensureFact(k){
  if(!S.facts[k]) S.facts[k] = {box:1, peak:1, due:S.sess, hits:0, days:[], stage:1, miss:0, rt:[]};
  const f = S.facts[k];
  if(!f.rt) f.rt = [];                        // saves from before timing existed
  if(f.peak == null) f.peak = f.box;          // ...and from before the uncapped twin
  return f;
}
/* ms = time to first keypress on a typed answer, or null when the question
   wasn't timed (multiple choice, hint opened, app backgrounded, > MAX_MS) */
function gradeFact(k, ok, run, ms){
  const f = ensureFact(k);
  S.stats.q++; run.answered++;
  if(ok){
    S.stats.c++; run.correct++;
    f.box  = Math.min(5, f.box + 1);
    f.peak = Math.min(5, f.peak + 1);        // the same ladder, without the cap
    if(ms != null){
      f.rt.push(ms);
      if(f.rt.length > FLUENCY.KEEP) f.rt = f.rt.slice(-FLUENCY.KEEP);
      if(run.times) run.times.push(ms);
      // right, but still working it out: keep it in circulation rather than
      // letting it graduate. Never a demotion ‚Äî just a scheduling ceiling.
      // f.peak is untouched, so she still gets credit for being right.
      if(!isFluent(k) && f.hits < FLUENCY.PATIENCE) f.box = Math.min(f.box, FLUENCY.CAP_BOX);
    }
    f.due = S.sess + INTERVAL[f.box];
    f.hits++;
    const d = today();
    if(f.days.indexOf(d) < 0) f.days.push(d);
    if(f.stage < 2) f.stage = 2;
    if(meetsMastery(k) && !isLearned(k)){ S.ever.push(k); run.mastered.push(k); }
  }else{
    f.box = 1; f.peak = 1;
    f.due = S.sess;
    f.stage = 2;
    f.miss = (f.miss||0) + 1;
    run.missed[k] = true;
  }
}

/* ==========================================================================
   END OF SESSION ‚Äî coins, streak, unlocks, table trophies
   ========================================================================== */
function finishSession(run){
  const d = today();
  let earned = ECON.SESSION;
  const lines = [{label:"Session finished", n:ECON.SESSION}];

  if(run.answered > 0 && run.correct === run.answered){
    earned += ECON.SWEEP; lines.push({label:"Every one first try", n:ECON.SWEEP});
  }
  if(run.mastered.length){
    const n = ECON.MASTER * run.mastered.length;
    earned += n; lines.push({label:run.mastered.length + (run.mastered.length===1?" fact locked in":" facts locked in"), n:n});
  }
  if(S.lastDay !== d){
    const gap = daysBetween(S.lastDay, d);
    S.streak = (S.lastDay && gap === 1) ? S.streak + 1 : 1;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
    S.lastDay = d;
    const n = ECON.DAY + Math.min(S.streak, 7) * ECON.STREAK_STEP;
    earned += n; lines.push({label:"Day " + S.streak + " of the streak", n:n});
  }

  S.stats.days[d] = S.stats.days[d] || {q:0,c:0};
  S.stats.days[d].q += run.answered;
  S.stats.days[d].c += run.correct;
  S.stats.hist.push({d:d, q:run.answered, c:run.correct, m:median(run.times)});
  if(S.stats.hist.length > 120) S.stats.hist = S.stats.hist.slice(-120);

  S.sess++;

  const opened = checkUnlocks();
  const trophies = [];
  UNLOCK_ORDER.forEach(t => {
    if(S.tablesDone.indexOf(t) < 0 && tableProgress(t) >= 1){
      S.tablesDone.push(t);
      earned += ECON.TABLE;
      lines.push({label:"The " + t + "s ‚Äî finished", n:ECON.TABLE});
      const id = TROPHY_FOR[t];
      if(id){ addToCollection(id); trophies.push(id); }
    }
  });

  /* Speed clubs ‚Äî in order, and at most ONE per session even if she clears
     both at once. Two clubs means two separate trips out for a prize; folding
     them into a single screen would spend both moments at the same time. */
  const clubsWon = [];
  for(const c of CLUBS){
    if(S.goals[c.id]) continue;
    const st = clubStatus(c);
    if(st.n < st.total) break;          // rungs are sequential
    S.goals[c.id] = d;
    earned += c.coins;
    lines.push({label:c.name + " ‚Äî every fact", n:c.coins});
    if(c.squishy) addToCollection(c.squishy);
    clubsWon.push(c);
    break;
  }

  S.coins += earned;
  save();
  return {earned:earned, lines:lines, opened:opened, trophies:trophies, clubs:clubsWon};
}

/* ==========================================================================
   COLLECTION + BLIND BOXES
   ========================================================================== */
function addToCollection(id){
  const had = !!S.coll[id];
  if(had) S.coll[id].n++;
  else S.coll[id] = {n:1, first:today(), fav:false};
  return had;
}
function rollTier(){
  S.sinceRare++; S.sinceEpic++;
  if(S.sinceEpic >= ECON.PITY_EPIC) return Math.random() < .78 ? "epic" : "legendary";
  if(S.sinceRare >= ECON.PITY_RARE) return Math.random() < .72 ? "rare" : (Math.random() < .8 ? "epic" : "legendary");
  const r = Math.random(), o = ECON.ODDS;
  if(r < o.legendary) return "legendary";
  if(r < o.legendary + o.epic) return "epic";
  if(r < o.legendary + o.epic + o.rare) return "rare";
  return "common";
}
function openBox(){
  if(S.coins < ECON.BOX_COST) return null;
  S.coins -= ECON.BOX_COST;
  S.boxes++;
  const tier = rollTier();
  if(tier !== "common") S.sinceRare = 0;
  if(tier === "epic" || tier === "legendary") S.sinceEpic = 0;
  let pool = BOX_POOL.filter(s => s.t === tier);
  if(!pool.length) pool = BOX_POOL.filter(s => s.t === "common");
  // nudge toward things she doesn't have yet, without guaranteeing it
  const missing = pool.filter(s => !S.coll[s.id]);
  if(missing.length && Math.random() < .72) pool = missing;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  const dup = addToCollection(pick.id);
  let refund = 0;
  if(dup){ refund = ECON.DUP[pick.t]; S.coins += refund; }
  save();
  return {sq:pick, dup:dup, refund:refund};
}

/* ==========================================================================
   PLACEMENT ‚Äî 20 questions, weighted to the easy tables so the first thing
   she does in this app is get a run of them right.
   ========================================================================== */
const PLACE_W = {2:5, 10:5, 5:4, 11:3, 3:3, 4:3, 6:2, 9:2, 8:1, 7:1, 12:1};
function buildPlacement(){
  const bag = ALL_FACTS.map(k => {
    const p = fparts(k);
    return {k:k, w:PLACE_W[p[0]] * PLACE_W[p[1]]};
  });
  const picked = [];
  for(let n=0; n<20 && bag.length; n++){
    let total = 0; bag.forEach(x => total += x.w);
    let r = Math.random() * total, idx = 0;
    for(let i=0;i<bag.length;i++){ r -= bag[i].w; if(r <= 0){ idx = i; break; } }
    picked.push(bag[idx].k);
    bag.splice(idx,1);
  }
  picked.sort((x,y) => fparts(x)[0]*fparts(x)[1] - fparts(y)[0]*fparts(y)[1]);
  return picked.map(k => Object.assign({k:"q", f:k}, orient(k)));
}
function applyPlacement(results){
  // results: [{f, ok}]  ‚Äî "not sure" answers are simply left untouched, so
  // the fact still gets its full three-stage introduction later.
  const byTable = {};
  results.forEach(r => {
    fparts(r.f).forEach(t => {
      byTable[t] = byTable[t] || {n:0, ok:0};
      byTable[t].n++; if(r.ok) byTable[t].ok++;
    });
    if(r.ok){
      const d = today();
      S.facts[r.f] = {box:3, due:S.sess + INTERVAL[3], hits:1, days:[d], stage:2, miss:0};
    }
  });
  // Skip ahead only along the unlock order, never past a table she stumbled
  // on. A couple of lucky answers on the 12s shouldn't open the 12s.
  S.unlocked = [UNLOCK_ORDER[0]];
  for(let i=1;i<UNLOCK_ORDER.length;i++){
    const t = UNLOCK_ORDER[i], s = byTable[t];
    if(s && s.ok >= 2 && s.ok / s.n >= .6) S.unlocked.push(t);
    else break;
  }
  S.placed = true;
  save();
}

   SOUND (off by default) + HAPTICS
   ========================================================================== */
let actx = null;
function tone(freq, dur, type, vol){
  if(!S.set.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, actx.currentTime);
    g.gain.linearRampToValueAtTime(vol || .12, actx.currentTime + .012);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .02);
  }catch(e){}
}
const SFX = {
  good(){ tone(660,.10,"sine",.10); setTimeout(()=>tone(880,.14,"sine",.09),80); },
  soft(){ tone(392,.16,"sine",.08); },
  tap(){  tone(520,.045,"sine",.05); },
  pop(){  tone(300,.08,"triangle",.14); setTimeout(()=>tone(720,.20,"sine",.12),70); setTimeout(()=>tone(1080,.24,"sine",.08),150); },
  win(){  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.22,"sine",.10), i*90)); }
};
function buzz(p){
  if(!S.set.haptics) return;
  try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){}
}

/* ============================ PRACTICE =================================== */
let RUN = null;

function startSession(){
  if(!S.placed){ startPlacement(); return; }
  const built = buildSession();
  RUN = {
    mode:"session", seq:built.seq, i:0, len:built.len,
    answered:0, correct:0, mastered:[], missed:{}, entry:"",
    firstTry:{}, tricksUsed:0, qStart:0, fastCount:0,

  };

  show("practice");

function startPlacement(){
  RUN = {
    mode:"place", seq:buildPlacement(), i:0, len:20,
    answered:0, correct:0, mastered:[], missed:{}, entry:"",
    results:[], qStart:0
  };
  $("#sessionKind").textContent = "Just looking";
  show("practice");
  $("#qArea").innerHTML = `
    <div class="qcard" style="min-height:auto">
      <div class="display t-xl">Let's find out what you already know.</div>
      <p class="soft t-sm" style="max-width:300px">20 quick ones. Nothing here counts for anything ‚Äî it just tells the app which facts to skip so you're not stuck doing baby questions.</p>
      <p class="soft t-sm">If you don't know one, hit <b>not sure yet</b>. That's a real answer.</p>
      <button class="btn btn-go pressable" id="placeGo" style="margin-top:6px">Ok, go</button>
    </div>`;
  $("#placeGo").onclick = () => { SFX.tap(); renderDots(); step(); };
  renderDots();

function renderDots(){
  const wrap = $("#dots");
  if(!RUN){ wrap.innerHTML = ""; return; }
  let h = "";
  for(let i=0;i<RUN.len;i++){
    const cls = i < RUN.answered ? "done" : (i === RUN.answered ? "now" : "");
    h += `<div class="dot ${cls}"></div>`;
  }
  wrap.innerHTML = h;
}

function step(){
  if(!RUN) return;
  renderDots();
  RUN.locked = false;
  if(RUN.answered >= RUN.len || RUN.i >= RUN.seq.length){ endRun(); return; }
  const it = RUN.seq[RUN.i];
  if(it.k === "meet")         renderMeet(it);
  else if(it.k === "concept") renderConcept(it);
  else if(it.k === "rule")    renderRule(it);
  else if(it.stage === 1)     renderChoice(it);
  else                        renderRecall(it);
}
/* null-safe: a pending advance timer can fire after she taps "Done for now" */
const advance = () => { if(!RUN) return; RUN.i++; step(); };

function renderConcept(it){

    : "Zero groups of something is nothing at all. <b>7 √ó 0 = 0</b>. <b>12 √ó 0 = 0</b>. Every single one is 0. Rule, not a fact.";
  const vis = isOnes
    ? `<div class="arraydots" style="grid-template-columns:repeat(6,13px)">${Array(6).fill('<i></i>').join("")}</div><div class="soft t-sm">one group of 6 ‚Üí still 6</div>`

    </div>
    <div class="saybox"><div class="t-sm">${body}</div></div>
    <div id="conceptQ" style="margin-top:12px"></div>`;
  let done = 0;
  const askOne = () => {
    if(done >= 3){
      S.concepts[isOnes?"ones":"zeros"] = 1;
      if(S.concepts.resurface === it.which) S.concepts.resurface = null;
      save();
      $("#conceptQ").innerHTML = `<button class="btn btn-go pressable" id="cGo">Locked in ‚Äî keep going</button>`;
      $("#cGo").onclick = () => { SFX.tap(); advance(); };
      return;
    }
    const v = 2 + Math.floor(Math.random()*11);
    const right = isOnes ? v : 0;
    const wrong = isOnes ? 1 : v;
    const opts = shuffle([right, wrong]);
    $("#conceptQ").innerHTML = `
      <div class="center display t-xl" style="margin-bottom:10px">${v} √ó ${isOnes?1:0} = ?</div>
      <div class="choices">${opts.map(o=>`<button class="choice pressable" data-v="${o}">${o}</button>`).join("")}</div>
      <div class="center soft t-sm" style="margin-top:8px">${done} of 3</div>`;
    $$("#conceptQ .choice").forEach(btn => btn.onclick = () => {
      if(btn.disabled) return;

      else { btn.classList.add("picked-off"); SFX.soft(); setTimeout(askOne, 500); }
    });
  };
  askOne();
}

/* --- stage 2: recognize (4-choice) ---------------------------------------- */
function renderChoice(it){
  const a = it.a, b = it.b, ans = a*b;

/* --- stage 3: recall (number pad) ----------------------------------------- */
function renderRecall(it){
  const a = it.a, b = it.b;
  RUN.entry = ""; RUN.qStart = Date.now();
  RUN.tFirst = null;        // ms to the first digit ‚Äî the retrieval moment
  RUN.timingVoid = false;   // set by a hint, or by the app losing focus
  const speed = RUN.mode === "session" && S.set.speed && S.tablesDone.length > 0;
  $("#speedBar").hidden = !speed;
  $("#qArea").innerHTML = `
    <div class="qcard">
      <div class="up soft">${RUN.mode === "place" ? "Do you know this one?" : "Type it"}</div>
      <div class="qtext">${a} <small>√ó</small> ${b}</div>
      <div class="answerbox empty" id="ansBox"></div>
    </div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key pressable" data-k="${n}">${n}</button>`).join("")}
      <button class="key key-clr pressable" data-k="clr">clear</button>
      <button class="key pressable" data-k="0">0</button>
      <button class="key key-go pressable" data-k="go">enter</button>
    </div>
    ${RUN.mode === "place"
      ? `<button class="btn-ghost pressable" id="dunno" style="margin-top:10px">not sure yet ‚Äî skip</button>`
      : `<button class="btn-ghost pressable" id="hintBtn" style="margin-top:10px">show me a trick</button><div id="hintSlot"></div>`}`;
  if(RUN.mode !== "place") wireHint(a,b);
  else $("#dunno").onclick = () => { SFX.tap(); placeAnswer(it, false, true); };

  if(speed){
    const bar = $("#speedBar").querySelector("i");
    bar.style.transition = "none"; bar.style.transform = "scaleX(1)";
    requestAnimationFrame(()=>{ bar.style.transition = "transform 9s linear"; bar.style.transform = "scaleX(0)"; });
  }

  const box = $("#ansBox");
  const draw = () => {
    box.textContent = RUN.entry;
    box.classList.toggle("empty", RUN.entry.length === 0);
  };
  $$("#qArea .key").forEach(k => k.onclick = () => {
    const v = k.dataset.k;
    SFX.tap();
    // clearing and retyping doesn't reset the clock ‚Äî she'd already recalled it
    if(v === "clr"){ RUN.entry = ""; buzz(6); draw(); return; }
    if(v === "go"){
      if(!RUN.entry.length || RUN.locked) return;
      RUN.locked = true;                       // one submit per question
      buzz(10);
      const ok = Number(RUN.entry) === a*b;
      if(RUN.mode === "place") placeAnswer(it, ok, false);
      else if(ok) onCorrect(it); else onMiss(it, Number(RUN.entry));
      return;
    }
    if(RUN.entry.length < 3){
      if(RUN.tFirst === null) RUN.tFirst = Date.now() - RUN.qStart;
      RUN.entry += v; buzz(5); draw();
    }
  });
  draw();
}

function wireHint(a,b){
  const btn = $("#hintBtn");
  if(!btn) return;
  btn.onclick = () => {
    const tk = trickFor(a,b);
    $("#hintSlot").innerHTML = `<div class="trick"><b>${tk.t}</b><br>${tk.b}</div>`;
    btn.hidden = true;
    if(RUN){ RUN.tricksUsed = (RUN.tricksUsed||0) + 1; RUN.timingVoid = true; }
    SFX.tap();
  };
}

/* --- outcomes ------------------------------------------------------------- */
/* the stopwatch reading for the question just answered, or null if it doesn't
   deserve one. Only typed answers in a real session are ever timed. */
function timingFor(it){
  if(!RUN || RUN.mode !== "session") return null;
  if(it.stage !== 2) return null;                    // multiple choice: untimed
  if(RUN.timingVoid) return null;                    // hint opened, or app backgrounded
  if(RUN.tFirst === null) return null;
  if(RUN.tFirst > FLUENCY.MAX_MS) return null;       // that was a distraction
  return RUN.tFirst;
}

function onCorrect(it){
  if(!RUN) return;
  $("#speedBar").hidden = true;
  const ms = timingFor(it);
  const fast = ms !== null && ms <= FLUENCY.FAST_MS;
  if(fast) RUN.fastCount++;
  gradeFact(it.f, true, RUN, ms);
  save();
  SFX.good(); buzz(14);
  const card = $("#qArea").querySelector(".qcard");
  if(card) card.classList.add("flash-good");
  const msg = fast ? pick(["ok that was fast","instant","you didn't even blink","no hesitation"]) : pick(PRAISE);
  const slot = document.createElement("div");
  slot.className = "center display t-lg";
  slot.style.marginTop = "14px";
  slot.textContent = msg;
  $("#qArea").appendChild(slot);
  setTimeout(advance, 700);
}

function onMiss(it, given){
  if(!RUN) return;
  $("#speedBar").hidden = true;
  const a = it.a, b = it.b, ans = a*b;
  gradeFact(it.f, false, RUN);
  save();
  SFX.soft(); buzz(8);
  const tk = trickFor(a,b);
  $("#qArea").innerHTML = `
    <div class="qcard">
      <div class="up soft">${pick(NEUTRAL)}</div>
      <div class="qtext">${a} <small>√ó</small> ${b} <small>=</small> ${ans}</div>
    </div>
    <div class="saybox">
      <div class="lede">${tk.t}</div>
      <div class="t-sm">${tk.b}</div>
    </div>
    <button class="btn btn-go pressable" id="missGo" style="margin-top:12px">Ok, got it</button>`;
  $("#missGo").onclick = () => {
    if(!RUN) return;
    SFX.tap();
    // put it back in this session, a few questions later
    const at = Math.min(RUN.i + 3, RUN.seq.length);
    RUN.seq.splice(at, 0, {k:"q", f:it.f, stage:2, a:a, b:b});
    advance();
  };
}

function placeAnswer(it, ok, skipped){
  if(!RUN) return;
  RUN.answered++;
  RUN.results.push({f:it.f, ok:ok});
  if(ok){ RUN.correct++; SFX.good(); buzz(12); }
  else { SFX.tap(); buzz(6); }
  const card = $("#qArea").querySelector(".qcard");
  if(card && ok) card.classList.add("flash-good");
  setTimeout(advance, ok ? 420 : 200);
}

    $("#doneArea").innerHTML = `

    <div class="card" style="margin-top:14px">

function renderBox(){

        </svg>
        <div class="puffs" id="bxPuffs"></div>
      </div>
      <div class="revealwrap" id="bxReveal" hidden></div>
    </div>
    <div class="center soft t-sm" id="bxHintLine">hold it‚Ä¶</div>`;
  wireSqueeze();

function wireSqueeze(){
  const hold = $("#boxHold"), ring = $("#bxRingFill"), glow = $("#bxGlow");
  const body = hold.querySelector("#bxBody"), lid = hold.querySelector("#bxLid");
  const HOLD_MS = reduced() ? 620 : 1150;
  let p = 0, pressing = false, raf = 0, last = 0, popped = false, buzzedAt = 0;

  const paint = () => {
    // deform: the box gets wider and shorter as pressure builds, with a
    // low-frequency wobble that grows with how hard she's holding it
    const t = performance.now()/1000;
    const wob = reduced() ? 0 : Math.sin(t*17) * p * 1.9;
    const sx = 1 + .19*p, sy = 1 - .23*p;
    hold.style.transform = `translateY(${p*10}px) rotate(${wob*.35}deg)`;
    body.style.transform = `scale(${sx}, ${sy})`;
    lid.style.transform  = `translateY(${p*13}px) scale(${1+.13*p}, ${1-.1*p}) rotate(${wob}deg)`;
    ring.style.strokeDashoffset = String(289 * (1-p));
    glow.classList.toggle("on", p > .55);
  };

  const loop = (now) => {
    const dt = Math.min(48, now - last); last = now;
    if(pressing){
      p = Math.min(1, p + dt/HOLD_MS);
      if(p - buzzedAt > .25){ buzzedAt = p; buzz(6); }
      if(p >= 1 && !popped){ popped = true; pressing = false; paint(); pop(); return; }
    }else{
      p = Math.max(0, p - dt/240);
    }
    paint();
    if(p > 0 || pressing) raf = requestAnimationFrame(loop);
    else raf = 0;
  };
  const start = e => {
    if(popped) return;
    e.preventDefault();
    pressing = true; last = performance.now(); buzzedAt = 0;
    $("#bxHintLine").textContent = "keep going‚Ä¶";
    if(!raf) raf = requestAnimationFrame(loop);
  };
  const stop = () => {
    if(popped || !pressing) return;
    pressing = false;
    $("#bxHintLine").textContent = "hold it a bit longer";
    if(!raf) raf = requestAnimationFrame(loop);
  };
  hold.addEventListener("pointerdown", start);
  hold.addEventListener("pointerup", stop);
  hold.addEventListener("pointercancel", stop);
  hold.addEventListener("pointerleave", stop);
  boxAnim = () => { pressing = false; cancelAnimationFrame(raf); raf = 0; };

  function pop(){
    const result = openBox();
    if(!result){ toast("Not enough coins yet"); renderBox(); return; }
    SFX.pop(); buzz([18,40,26]);
    $("#bxHintLine").textContent = "";
    $("#coinNum2").textContent = S.coins;

    // lid launches
    lid.style.transition = reduced() ? "none" : "transform .5s cubic-bezier(.2,.9,.3,1), opacity .5s ease";
    lid.style.transform = "translateY(-120px) rotate(-22deg) scale(1.05)";
    lid.style.opacity = "0";

    // particle puff ‚Äî soft, no confetti
    if(!reduced()){
      const wrap = $("#bxPuffs");
      for(let i=0;i<16;i++){
        const s = document.createElement("span");
        const size = 6 + Math.random()*14;
        s.style.width = s.style.height = size + "px";
        s.style.marginLeft = s.style.marginTop = (-size/2) + "px";
        s.style.background = i % 3 === 0 ? "var(--teal)" : (i % 3 === 1 ? "var(--zap)" : "var(--teal-soft)");
        wrap.appendChild(s);
        const ang = (i/16)*Math.PI*2 + Math.random()*.4;
        const dist = 70 + Math.random()*70;
        s.animate([
          {transform:"translate(0,0) scale(.4)", opacity:.95},
          {transform:`translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist - 20}px) scale(1)`, opacity:0}
        ], {duration:620 + Math.random()*280, easing:"cubic-bezier(.15,.8,.3,1)", fill:"forwards"});
        setTimeout(()=>s.remove(), 1000);
      }
    }

    // spring: overshoot and settle
    if(reduced()){
      body.style.transform = "scale(1,1)";
      setTimeout(()=>reveal(result), 220);
    }else{
      let x = .72, v = 9.5, t0 = performance.now();
      const k = 210, c = 15;
      const spring = now => {
        const dt = Math.min(.032, (now - t0)/1000); t0 = now;
        v += (-k*(x-1) - c*v) * dt;
        x += v * dt;
        body.style.transform = `scale(${1 + (x-1)*1.15}, ${1 - (x-1)*.55})`;
        hold.style.transform = `translateY(${(1-x)*14}px)`;
        if(Math.abs(x-1) > .004 || Math.abs(v) > .05) requestAnimationFrame(spring);
        else { body.style.transform = "scale(1,1)"; hold.style.transform = "none"; }
      };
      requestAnimationFrame(spring);
      setTimeout(()=>reveal(result), 380);
    }
  }

  function reveal(result){
    const sq = result.sq;
    const wrap = $("#bxReveal");
    glow.classList.remove("on");            // let the reward glow fade behind the card
    const found = Object.keys(S.coll).length;
    $("#bxHead").innerHTML = result.dup
      ? `<div class="display t-xl">Seen that one before</div><div class="soft t-sm">Traded straight back into coins.</div>`
      : `<div class="display t-xl">That's a new one</div><div class="soft t-sm">${found} of ${SQUISHIES.length} found</div>`;
    wrap.hidden = false;
    wrap.innerHTML = `<div class="revealcard" id="revCard">
      <div class="sqframe" style="height:126px">${SV(sq.art)}</div>
      <div class="rarityflag" style="background:${TIER_COLOR[sq.t]}">${TIER_LABEL[sq.t]}</div>
      <div class="display t-xl" style="margin-top:6px">${sq.n}</div>
      <div class="t-sm soft" style="margin-top:4px">${sq.bio}</div>
      ${result.dup ? `<div class="t-sm" style="margin-top:8px">Already had this one ‚Äî turned into <b>+${result.refund}</b> coins.</div>` : ""}
    </div>`;
    const card = $("#revCard");
    if(!reduced()){
      card.animate([
        {transform:"scale(.4) translateY(28px)", opacity:0},
        {transform:"scale(1.09) translateY(-4px)", opacity:1, offset:.55},
        {transform:"scale(1) translateY(0)", opacity:1}
      ], {duration:560, easing:"cubic-bezier(.2,1.1,.3,1)"});
    }
    if(sq.t === "epic" || sq.t === "legendary") SFX.win();
    setTimeout(()=>{
      $("#boxArea").insertAdjacentHTML("beforeend", `
        <div class="stack" style="margin-top:14px" id="bxAfter">
          ${S.coins >= ECON.BOX_COST ? `<button class="btn btn-zap pressable" id="bxAgain">Open another (${ECON.BOX_COST})</button>` : ""}
          <button class="btn pressable" id="bxShelf2">Shelf</button>
          <button class="btn-ghost pressable" id="bxHome">Home</button>
        </div>`);
      const again = $("#bxAgain");
      if(again) again.onclick = () => { SFX.tap(); renderBox(); };
      $("#bxShelf2").onclick = () => { SFX.tap(); renderShelf(); show("shelf"); };
      $("#bxHome").onclick = () => { SFX.tap(); renderHome(); show("home"); };
      $("#coinNum2").textContent = S.coins;
    }, 620);
  }
}

/* ============================ SHELF ====================================== */
let shelfTab = "all";
function renderShelf(){
  const owned = Object.keys(S.coll).length;
  $("#shelfCount").textContent = owned + " / " + SQUISHIES.length;
  const tabs = [["all","All"],["favs","Pinned"],["common","Common"],["rare","Rare"],["epic","Epic"],["legendary","Legendary"]];
  $("#shelfTabs").innerHTML = tabs.map(t=>`<button class="tab ${shelfTab===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");
  $$("#shelfTabs .tab").forEach(b => b.onclick = () => { shelfTab = b.dataset.t; SFX.tap(); renderShelf(); });

  let list = SQUISHIES.slice();
  if(shelfTab === "favs") list = list.filter(s => S.coll[s.id] && S.coll[s.id].fav);
  else if(shelfTab !== "all") list = list.filter(s => s.t === shelfTab);

  if(!list.length){
    $("#shelfGrid").innerHTML = `<div class="card" style="grid-column:1/-1"><div class="t-sm soft">Nothing pinned yet. Tap any squishy you like and hit the pin ‚Äî it'll live up here.</div></div>`;
    return;
  }
  $("#shelfGrid").innerHTML = list.map(s => {
    const have = S.coll[s.id];
    return `<button class="slot pressable ${have?"":"locked"}" data-id="${s.id}">
      ${have && have.n > 1 ? `<span class="ct">√ó${have.n}</span>` : ""}
      ${have && have.fav ? `<span class="pin"><svg viewBox="0 0 20 20"><path d="M10 2l2.4 5 5.6.7-4 3.9 1 5.4L10 14.4 4.9 17l1-5.4-4-3.9L7.6 7z" fill="#5FC4BB" stroke="#1F3E3C" stroke-width="1.2"/></svg></span>` : ""}
      <div class="sqframe ${have?"":"silhouette"}">${SV(s.art)}</div>
      <div class="nm">${have ? s.n : (s.table ? "Table " + s.table : (s.milestone ? "Under " + s.milestone + "s" : "???"))}</div>
      <div class="tierbar tier-${s.t}"></div>
    </button>`;
  }).join("");
  $$("#shelfGrid .slot").forEach(b => b.onclick = () => { SFX.tap(); openDetail(b.dataset.id); });
}

function openDetail(id){
  const s = BY_ID[id], have = S.coll[id];
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet">
    <div class="sqframe ${have?"":"silhouette"}" style="height:170px">${SV(s.art)}</div>
    <div class="center">
      <div class="rarityflag" style="background:${TIER_COLOR[s.t]}">${TIER_LABEL[s.t]}</div>
      <div class="display t-2xl" style="margin-top:8px">${have ? s.n : "Not found yet"}</div>
      <div class="t-sm soft" style="margin-top:6px">${have ? s.bio
        : s.table ? "Finish the " + s.table + "s and this one is yours. Guaranteed ‚Äî no box needed."
        : s.milestone ? "Not in any box. Answer all 66 facts in under " + s.milestone + " seconds each and she turns up on her own."
        : "Still out there somewhere in a box."}</div>
      ${have ? `<div class="t-sm faint" style="margin-top:10px">Found ${have.first}${have.n>1?" ¬∑ "+have.n+" copies":""}</div>` : ""}
    </div>
    <div class="stack" style="margin-top:16px">
      ${have ? `<button class="btn btn-sm pressable" id="favBtn">${have.fav?"Unpin from the front":"Pin to the front"}</button>` : ""}
      <button class="btn-ghost pressable" id="closeSheet">Close</button>
    </div></div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.onclick = e => { if(e.target === scrim) close(); };
  scrim.querySelector("#closeSheet").onclick = () => { SFX.tap(); close(); };
  const fav = scrim.querySelector("#favBtn");
  if(fav) fav.onclick = () => {
    S.coll[id].fav = !S.coll[id].fav; save(); SFX.tap(); buzz(8);
    close(); renderShelf();
  };
}
